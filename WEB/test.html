<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Web Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2563eb;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        button {
            padding: 10px 15px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Simple HTML Example</p>
    </header>

    <main>
        <h2>About</h2>
        <p>This is a basic HTML page structure.</p>

        <button onclick="showMessage()">Click Me</button>
    </main>

    <script>
        function showMessage() {
            alert("Hello! This is JavaScript inside HTML 😊");
        }
    </script>

</body>
</html>
